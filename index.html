<style>
/* Layout: a black stock-page album in four levels — a world map of countries, a country's contents (issues + stamp index), an issue page of mounted stamps, and a stamp page with front, back and history. */
:root {
  --page: #0e0f10;
  --mount: #17191b;
  --rule: #2c3033;
  --ink: #e9e6df;
  --muted: #a19d94;
  --gilt: #c8ab6e;
  --gilt-hi: #e2c88f;
  --land: #26292c;
  --font-display: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --font-body: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --font-data: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
body { background: var(--page); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
a { color: inherit; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 32px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eyebrow { font-family: var(--font-data); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--gilt); }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(34px, 6vw, 56px); line-height: 1.05; margin: 0; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 400; font-size: 26px; line-height: 1.15; margin: 0; text-wrap: balance; }
.lede { color: var(--muted); max-width: 64ch; margin: 0; }
.head { display: grid; gap: 10px; padding-bottom: 26px; border-bottom: 1px solid var(--rule); }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px 10px; font-family: var(--font-data); font-size: 12px; letter-spacing: .06em; color: var(--muted); }
.crumbs a { text-decoration: none; color: var(--gilt); }
.crumbs a:hover, .crumbs a:focus-visible { text-decoration: underline; }
.label { font-family: var(--font-data); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0; }
:focus-visible { outline: 2px solid var(--gilt); outline-offset: 4px; }

/* World */
.map { position: relative; padding: 18px; background: var(--mount); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.map svg { display: block; width: 100%; height: auto; }
.map path { fill: var(--land); stroke: var(--page); stroke-width: .5; }
.map a path { fill: var(--gilt); cursor: pointer; transition: fill .15s ease; }
.map a:hover path, .map a:focus-visible path { fill: var(--gilt-hi); }
.map a:focus-visible { outline: none; }
.tip { position: absolute; pointer-events: none; font-family: var(--font-data); font-size: 12px; background: var(--page); border: 1px solid var(--rule); padding: 4px 8px; white-space: nowrap; transform: translate(-50%, -130%); }
.tip b { color: var(--gilt); font-weight: 500; }
.countries { display: grid; gap: 0; }
.country-row { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 16px 28px; padding-block: 22px; border-bottom: 1px solid var(--rule); align-items: center; }
.country-row h2 a { text-decoration: none; }
.country-row h2 a:hover { color: var(--gilt); }

/* Contents */
.issues { display: grid; gap: 0; }
.issue-row { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 16px 28px; padding-block: 22px; border-bottom: 1px solid var(--rule); align-items: center; }
.issue-row h2 a { text-decoration: none; }
.issue-row h2 a:hover { color: var(--gilt); }
.issue-meta { display: grid; gap: 4px; }
.issue-meta .sub { font-family: var(--font-data); font-size: 12px; color: var(--muted); }
.thumbs { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.thumbs a { display: block; }
.thumbs img { height: 74px; width: auto; display: block; box-shadow: 0 4px 12px rgba(0,0,0,.5); transition: transform .15s ease; }
.thumbs a:hover img { transform: translateY(-2px); }
.index { columns: 2 280px; column-gap: 32px; margin: 0; padding: 0; list-style: none; }
.index li { break-inside: avoid; border-bottom: 1px solid var(--rule); }
.index a { display: grid; grid-template-columns: 58px 1fr; gap: 10px; padding: 7px 0; text-decoration: none; font-size: 15px; }
.index a:hover .t { color: var(--gilt); }
.index .no, .no { font-family: var(--font-data); font-size: 13px; color: var(--gilt); font-variant-numeric: tabular-nums; }
.index .c { color: var(--muted); font-style: italic; }
.block { display: grid; gap: 16px; padding-top: 34px; }
.jump { font-family: var(--font-data); font-size: 13px; letter-spacing: .06em; }
.jump a, footer a, .lede a { color: var(--gilt); }
.jump a { text-decoration: none; border: 1px solid var(--rule); padding: 6px 12px; display: inline-block; }
.jump a:hover, .jump a:focus-visible { border-color: var(--gilt); }
.index-group { gap: 10px; padding-top: 30px; }
.issue-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; border-bottom: 1px solid var(--gilt); padding-bottom: 6px; }
.issue-head h2 a { text-decoration: none; }
.issue-head h2 a:hover { color: var(--gilt); }
.issue-head .sub { font-family: var(--font-data); font-size: 12px; color: var(--muted); }
footer { line-height: 1.9; }

/* Issue */
.strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 30px 22px; padding: 28px 22px; background: var(--mount); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.slot { display: grid; grid-template-rows: 230px auto; gap: 12px; text-decoration: none; }
.slot .frame { display: grid; place-items: center; min-width: 0; }
.slot img { max-height: 230px; width: auto; box-shadow: 0 6px 18px rgba(0,0,0,.55); transition: transform .18s ease; }
.slot:hover img { transform: translateY(-3px) scale(1.02); }
.cap { display: grid; gap: 1px; }
.cap .what { font-size: 15px; line-height: 1.35; }
.cap .col { font-size: 13px; color: var(--muted); font-style: italic; }
.wanting { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
.wanting li { font-family: var(--font-data); font-size: 13px; color: var(--muted); border: 1px dashed var(--rule); padding: 4px 10px; font-variant-numeric: tabular-nums; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding-top: 22px; font-family: var(--font-data); font-size: 13px; }
.pager a { text-decoration: none; color: var(--gilt); display: grid; gap: 2px; }
.pager a span { color: var(--muted); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
.pager .next { text-align: right; }
.pager a:hover b { text-decoration: underline; }
.pager b { font-weight: 500; }

/* Stamp */
.stamp { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 30px; padding-top: 28px; }
.photos { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 22px; background: var(--mount); align-content: start; align-items: start; }
.photos figure { margin: 0; display: grid; gap: 6px; }
.photos img { width: 100%; height: auto; box-shadow: 0 6px 18px rgba(0,0,0,.55); }
.photos figcaption { font-family: var(--font-data); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.info { display: grid; gap: 16px; align-content: start; min-width: 0; }
dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; font-size: 15px; }
dt { font-family: var(--font-data); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding-top: 4px; }
dd { margin: 0; }
.info p { margin: 0; }
.info strong, .era strong { color: var(--gilt); font-weight: 600; }
footer { margin-top: 44px; padding-top: 20px; border-top: 1px solid var(--rule); color: var(--muted); font-size: 13px; font-family: var(--font-data); }

/* Covers */
.cover-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px 26px; padding: 28px 22px; background: var(--mount); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.cover-card { display: grid; gap: 12px; text-decoration: none; align-content: start; }
.cover-card img { width: 100%; height: auto; box-shadow: 0 6px 18px rgba(0,0,0,.55); transition: transform .18s ease; }
.cover-card:hover img { transform: translateY(-3px); }
.cover-card:hover .what { color: var(--gilt); }
.cover { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 30px; padding-top: 28px; }
.cover .photos { grid-template-columns: 1fr; }

@media (max-width: 720px) {
  .issue-row, .country-row { grid-template-columns: 1fr; }
  .thumbs img { height: 60px; }
  .stamp, .cover { grid-template-columns: 1fr; }
  .cover-grid { grid-template-columns: 1fr; padding: 18px 12px; }
  .strip { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 22px 14px; padding: 18px 12px; }
  .slot { grid-template-rows: 170px auto; }
  .slot img { max-height: 170px; }
  .map { padding: 8px; }
}
@media (prefers-reduced-motion: reduce) { .slot img, .thumbs img, .map a path { transition: none; } .slot:hover img, .thumbs a:hover img, .cover-card:hover img { transform: none; } .cover-card img { transition: none; } }
</style>

{"n": "405", "year": "1912", "denom": "1¢", "color": "green", "series": "1912-14 Washington-Franklin Issue", "perf": "12", "title": "1912 1¢ Washington", "design": "George Washington profile in an oval with laurel, with the numerals \"1 CENT 1\" below.", "printer": "Bureau of Engraving and Printing", "history": ["Washington replaced Franklin on the 1¢ in 1912, so the 1¢ and 2¢ shared a portrait and were told apart by color and numerals.", "In 1912 the Bureau reworked the Washington-Franklin designs. The 1¢ and 2¢ got numerals in place of the words \"ONE CENT\" and \"TWO CENTS\" so clerks could tell them apart quickly, and Franklin moved from the 1¢ to all the values from 8¢ up, to set the high values apart from the low ones. Washington kept the 1¢ to 7¢. The changes followed the start of Parcel Post in 1913, which drove demand for high values."], "cond": "Used"},

{"n": "452", "year": "1914", "denom": "1¢", "color": "green", "series": "1914-16 Perf 10 Coil Issue", "perf": "Imperforate × 10", "title": "1914 1¢ Washington Coil", "design": "George Washington profile in an oval with laurel, with \"1 CENT 1\" below.", "printer": "Bureau of Engraving and Printing", "history": ["The 1¢ rotary press coil, perforated vertically for vending and affixing machines that fed the roll sideways.", "Coils were rolls of stamps for vending and affixing machines, which business mailers and post offices adopted in the 1900s. At first private companies bought imperforate sheets and cut and perforated them themselves (the Schermack and Mail-O-Meter private perforations). In 1908 the Bureau began making its own coils, and from 1914 it printed them on the new rotary press, which printed from curved plates on a continuous web of paper. The rotary press was faster and cheaper, and it became the Bureau's main press for definitives."], "cond": "Used"},

const scottKey = n => [parseInt(n, 10), n.replace(/^\d+/, "")];
const byScott = (a, b) => { const [x, xs] = scottKey(a.n), [y, ys] = scottKey(b.n); return x - y || xs.localeCompare(ys); };
for (const c of COUNTRIES) {

    return { ...i, country: c, stamps, printer: stamps[0]?.printer, era: stamps[0]?.history.at(-1) };
  }).filter(i => i.stamps.length);
  c.ordered = c.issues.flatMap(i => i.stamps.map(s => ({ ...s, issue: i })));

      <div class="cover-grid">
        ${COVERS.map(v => `
          <a class="cover-card" href="#covers/${v.slug}">
            <img src="${coverSrc(v, "f")}" alt="${esc(v.title)}, ${esc(v.period)}" loading="lazy">
            <span class="cap"><span class="no">${esc(v.period)}</span><span class="what">${esc(v.title)}</span><span class="col">${esc(v.route)}</span></span>
          </a>`).join("")}
      </div>
    </div>`;
}

function coverPage(v) {
  const at = COVERS.indexOf(v), prev = COVERS[at - 1], next = COVERS[at + 1];
  document.title = `${v.title}, ${v.period} · Covers`;
  const facts = [["Mailed", v.period], ["Route", v.route], ["Postage", v.postage], ["Rate", v.rate], ["Corner card", v.corner], ["Addressed to", v.to]];
  return `
    <div class="head">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="#world">World</a><span>›</span><a href="#covers">Covers</a><span>›</span><span>${esc(v.title)}</span></nav>
      <div class="eyebrow">${esc(v.type)} cover · ${esc(v.period)}</div>
      <h1>${esc(v.title)}</h1>
    </div>
    <div class="cover">
      <div class="photos">
        <figure><img src="${coverSrc(v, "f")}" alt="Front of the ${esc(v.title)} cover"><figcaption>Front</figcaption></figure>
        <figure><img src="${coverSrc(v, "b")}" alt="Back of the ${esc(v.title)} cover"><figcaption>Back</figcaption></figure>
      </div>
      <div class="info">
        <dl>${facts.filter(([, val]) => val).map(([k, val]) => `<dt>${k}</dt><dd>${md(val)}</dd>`).join("")}</dl>
        ${v.story.map(p => `<p>${md(p)}</p>`).join("")}
        ${v.context.map(p => `<p class="lede">${md(p)}</p>`).join("")}
      </div>
    </div>
    <nav class="pager" aria-label="Covers">
      ${prev ? `<a href="#covers/${prev.slug}"><span>← Previous cover</span><b>${esc(prev.title)} · ${esc(prev.period)}</b></a>` : "<span></span>"}
      ${next ? `<a class="next" href="#covers/${next.slug}"><span>Next cover →</span><b>${esc(next.title)} · ${esc(next.period)}</b></a>` : ""}
    </nav>`;
}

function contents(c) {
  document.title = `${c.title} · ${SITE}`;
  return `
    <div class="head">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="#world">World</a><span>›</span><span>${esc(c.name)}</span></nav>
      <div class="eyebrow">${esc(c.eyebrow)}</div>
      <h1>${esc(c.title)}</h1>
      <p class="lede">${count(c.stamps.length)} from the family collection, ${c.blurb}. Choose an issue to page through its stamps, or go straight to a stamp from the <a href="#${c.code}/index">stamp index</a>.</p>
      <nav class="jump"><a href="#${c.code}/index">Stamp index →</a></nav>
    </div>
    <div class="block">
      <p class="label">Issues</p>
      <div class="issues">
        ${c.issues.map(i => `
          <div class="issue-row">
            <div class="issue-meta">
              <h2><a href="#${c.code}/issue-${i.key}">${esc(i.name)}</a></h2>
              <span class="sub">${esc(i.printer)} · ${count(i.stamps.length)}${i.missing.length ? ` · ${i.missing.length} wanting` : ""}</span>
            </div>
            <div class="thumbs">${i.stamps.map(s => `<a href="#${c.code}/sc-${s.n}" title="Sc. ${s.n} · ${esc(label(s))}"><img src="${src(c, s, "f")}" alt="Scott ${s.n}, ${esc(label(s))}" loading="lazy"></a>`).join("")}</div>
          </div>`).join("")}
      </div>
    </div>
`;
}

function indexPage(c) {
  document.title = `Stamp Index · ${c.title}`;
  return `
    <div class="head">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="#world">World</a><span>›</span><a href="#${c.code}">${esc(c.name)}</a><span>›</span><span>Stamp index</span></nav>
      <h1>Stamp Index</h1>
      <p class="lede">Every stamp in the ${esc(c.name)} section, by issue and ${esc(c.catalog)} number. Choose a stamp to see its front, back and history.</p>
    </div>
    ${c.issues.map(i => `
      <div class="block index-group">
        <div class="issue-head">
          <h2><a href="#${c.code}/issue-${i.key}">${esc(i.name)}</a></h2>
          <span class="sub">${esc(i.printer)} · ${count(i.stamps.length)}</span>
        </div>
        <ul class="index">
          ${i.stamps.map(s => `<li><a href="#${c.code}/sc-${s.n}"><span class="no">Sc. ${s.n}</span><span><span class="t">${esc(label(s))}</span> · <span class="c">${esc(s.color)}</span></span></a></li>`).join("")}
        </ul>
      </div>`).join("")}`;
}

function issuePage(i) {
  const c = i.country, at = c.issues.indexOf(i), prev = c.issues[at - 1], next = c.issues[at + 1];
  document.title = `${i.name} · ${c.title}`;
  return `
    <div class="head">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="#world">World</a><span>›</span><a href="#${c.code}">${esc(c.name)}</a><span>›</span><span>${esc(i.name)}</span></nav>
      <h1>${esc(i.name)}</h1>
      <span class="label">${esc(i.printer)} · ${count(i.stamps.length)}</span>
      <p class="lede era">${md(i.era)}</p>
    </div>
    <div class="block">
      <div class="strip">
        ${i.stamps.map(s => `
          <a class="slot" href="#${c.code}/sc-${s.n}">
            <span class="frame"><img src="${src(c, s, "f")}" alt="Scott ${s.n}, ${esc(label(s))}" loading="lazy"></span>
            <span class="cap"><span class="no">Sc. ${s.n}</span><span class="what">${esc(label(s))}</span><span class="col">${esc(s.color)}</span></span>
          </a>`).join("")}
      </div>
    </div>
    ${i.missing.length ? `
    <div class="block">
      <p class="label">Not yet in the album</p>
      <ul class="wanting">${i.missing.map(n => `<li>Sc. ${esc(n)}</li>`).join("")}</ul>
    </div>` : i.complete ? `
    <div class="block">
      <p class="label">Complete: every Scott number in this issue is in the album</p>
    </div>` : ""}
    <nav class="pager" aria-label="Issues">
      ${prev ? `<a href="#${c.code}/issue-${prev.key}"><span>← Previous issue</span><b>${esc(prev.name)}</b></a>` : "<span></span>"}
      ${next ? `<a class="next" href="#${c.code}/issue-${next.key}"><span>Next issue →</span><b>${esc(next.name)}</b></a>` : ""}
    </nav>`;
}

function stampPage(c, s) {
  const at = c.byNo[s.n], prev = c.ordered[at - 1], next = c.ordered[at + 1];
  document.title = `Sc. ${s.n} ${label(s)} · ${c.title}`;
  const facts = [["Color", s.color], ["Perforation", s.perf], ["Printer", s.printer], ["Condition", s.cond], ["Design", s.design]];
  return `
    <div class="head">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="#world">World</a><span>›</span><a href="#${c.code}">${esc(c.name)}</a><span>›</span><a href="#${c.code}/issue-${s.issue.key}">${esc(s.issue.name)}</a><span>›</span><span>Sc. ${s.n}</span></nav>
      <div class="eyebrow">${esc(c.catalog)} ${s.n}</div>
      <h1>${esc(label(s))}</h1>
    </div>
    <div class="stamp">
      <div class="photos">
        <figure><img src="${src(c, s, "f")}" alt="Front of Scott ${s.n}"><figcaption>Front</figcaption></figure>
        <figure><img src="${src(c, s, "b")}" alt="Back of Scott ${s.n}"><figcaption>Back</figcaption></figure>
      </div>
      <div class="info">
        <dl>${facts.filter(([, v]) => v).map(([k, v]) => `<dt>${k}</dt><dd>${md(v)}</dd>`).join("")}</dl>
        ${s.history.slice(0, -1).map(p => `<p>${md(p)}</p>`).join("")}
      </div>
    </div>
    <nav class="pager" aria-label="Stamps">
      ${prev ? `<a href="#${c.code}/sc-${prev.n}"><span>← Previous stamp</span><b>Sc. ${prev.n} · ${esc(label(prev))}</b></a>` : "<span></span>"}
      ${next ? `<a class="next" href="#${c.code}/sc-${next.n}"><span>Next stamp →</span><b>Sc. ${next.n} · ${esc(label(next))}</b></a>` : ""}
    </nav>`;
}

// Links from before the album went worldwide (#contents, #index, #issue-1857, #sc-96) all meant the US section.
const LEGACY = /^(contents|index|issue-.+|sc-.+)$/;

function route() {
  let h = decodeURIComponent(location.hash.slice(1));
  if (LEGACY.test(h)) { location.replace(h === "contents" ? "#us" : `#us/${h}`); return; }
  const [code, page = ""] = h.split("/");
  const c = BY_CODE[code];
  let html;
  if (code === "covers") {
    const v = COVERS.find(x => x.slug === page);
    html = page ? (v && coverPage(v)) : coversPage();
    view.innerHTML = html || world();
    foot.innerHTML = html ? `<a href="#world">World</a> · <a href="#covers">Covers</a>` : `Map: Natural Earth, via world-atlas.`;
    if (!html) wireMap();
    window.scrollTo(0, 0);
    return;
  }
  if (c) {
    if (page === "index") html = indexPage(c);
    else if (page.startsWith("issue-")) { const i = c.issues.find(x => x.key === page.slice(6)); if (i) html = issuePage(i); }
    else if (page.startsWith("sc-") && page.slice(3) in c.byNo) html = stampPage(c, c.ordered[c.byNo[page.slice(3)]]);
    else if (!page) html = contents(c);
  }
  view.innerHTML = html || world();
  foot.innerHTML = c && html
    ? `<a href="#world">World</a> · <a href="#${c.code}">${esc(c.name)} contents</a> · <a href="#${c.code}/index">Stamp index</a><br>${c.source}`
    : `Map: Natural Earth, via world-atlas.`;
  if (!html) wireMap();
  window.scrollTo(0, 0);
}

function wireMap() {
  const map = document.getElementById("map"), tip = document.getElementById("tip");
  map.addEventListener("pointermove", e => {
    const t = e.target.closest("[data-tip]");
    if (!t) { tip.hidden = true; return; }
    const r = map.getBoundingClientRect();
    tip.innerHTML = t.dataset.n ? `<b>${t.dataset.tip}</b> · ${t.dataset.n}` : `${t.dataset.tip} · not yet in the album`;
    tip.style.left = `${e.clientX - r.left}px`;
    tip.style.top = `${e.clientY - r.top}px`;
    tip.hidden = false;
  });
  map.addEventListener("pointerleave", () => { tip.hidden = true; });
}

addEventListener("hashchange", route);
document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea")) return;
  const pager = view.querySelector(".pager");
  if (!pager) return;
  const links = pager.querySelectorAll("a");
  if (e.key === "ArrowLeft" && links[0] && !links[0].classList.contains("next")) links[0].click();
  if (e.key === "ArrowRight") { const n = pager.querySelector("a.next"); if (n) n.click(); }
});
route();
</script>
</body></html>
